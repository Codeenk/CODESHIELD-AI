services:
  codeshield:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: codeshield:latest
    ports:
      - "8000:8000"
    environment:
      CODESHIELD_MODEL_MODE: "off"
      CODESHIELD_AUTH: "on"
      CODESHIELD_SECRET_KEY: "change-me-in-production"
      CODESHIELD_DATA_DIR: /data
      # CODESHIELD_API_TOKEN: "change-me"
    volumes:
      - codeshield-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  codeshield-data:
